name: Build Python RAT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build Executable
      # Жестко собираем зависимости requests и PIL, исключаем мусор
      run: pyinstaller --onefile --collect-all requests --collect-all PIL --hidden-import PIL.ImageGrab main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoxRAT_Python
        path: dist/main.exe
