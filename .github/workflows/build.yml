name: Build FoxRAT Combo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Обновлено до v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.12
      with:
        cmake-version: '3.22.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Generate VS Solution
      run: cmake -G "Visual Studio 17 2022" -A x64 -S . -B build

    - name: Build Release
      run: msbuild build/FoxRAT.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # Обновлено до v4
      with:
        name: FoxRAT_Built
        path: build/Release/FoxRAT.exe
