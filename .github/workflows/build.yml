name: Build Winlock EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --uac-admin --name winlock winlock.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlock-exe
          path: dist/winlock.exe
          retention-days: 90
