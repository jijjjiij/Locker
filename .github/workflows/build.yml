name: Build FoxBomber

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build Executable
      # Собираем с консолью, так как интерфейс работает в терминале
      run: pyinstaller --onefile --collect-all curl_cffi main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoxBomber
        path: dist/main.exe
